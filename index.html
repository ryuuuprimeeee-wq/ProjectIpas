<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>InfoLokal Bogor - Panduan Wisata</title>
    <link rel="stylesheet" href="Style/style.css">
  </head>
  <body>
    <div id="landing-page">
      <nav>
        <div class="logo">Info<span>Lokal</span> Bogor</div>
        <ul class="nav-links">
          <li><a href="#">Informasi</a></li>
          <li><a href="#" class="active">Beranda</a></li>
          <li><button onclick="openApp()">Jelajah</button></li>
          <li><a href="#" class="btn-login">Masuk</a></li>
        </ul>
      </nav>

      <div class="hero">
        <div class="hero-tag">PUSAT INFORMASI PARIWISATA</div>
        <h1>Eksplorasi Keajaiban <br /><span>Kota Hujan Bogor</span></h1>
        <p>
          Temukan kuliner legendaris, destinasi alam terbaik, dan berita
          pariwisata daerah Bogor terlengkap.
        </p>
        <button class="btn-explore" onclick="openApp()">
          Jelajah Sekarang
        </button>
      </div>
    </div>

    <!-- MAIN APP DASHBOARD -->
    <div id="main-app">
      <aside class="sidebar">
        <div class="sidebar-header">Info<span>Lokal</span></div>
        <div class="sidebar-menu">
          <button class="active" onclick="setCategory('Semua', this)">
            Semua
          </button>
          <button onclick="setCategory('Kuliner', this)">Kuliner</button>
          <button onclick="setCategory('Destinasi', this)">Destinasi</button>
          <button onclick="setCategory('Event', this)">Event</button>
          <button onclick="setCategory('Berita', this)">Berita</button>
        </div>
        <div class="sidebar-footer">
          <button class="btn-back" onclick="closeApp()">
            ← <span>Kembali</span>
          </button>
        </div>
      </aside>

      <main class="main-content">
        <header>
          <div class="search-box">
            <input
              type="text"
              id="searchInput"
              onkeyup="handleSearch()"
              placeholder="Cari info lokal Bogor..."
            />
          </div>
          <div class="location-badge">Bogor, Jawa Barat</div>
        </header>

        <div class="content-body" id="cardContainer">
          <!-- Cards will be generated here -->
        </div>
      </main>
    </div>
    <script src="Script/script.js"></script>
  </body>
</html>
